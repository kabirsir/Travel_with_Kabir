<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Travel with Kabir</title>
    <link rel="icon" href="/vite.svg" />
    <script>
      // Simple Tailwind-like minimal styles for standalone page
      document.addEventListener('DOMContentLoaded', function(){
        document.body.style.margin='0';
        document.body.style.fontFamily='system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
      });
    </script>
    <style>
      :root{--brand:#FFF8C9;--text:#111827}
      body{color:var(--text)}
      .container{max-width:1120px;margin:0 auto;padding:2rem}
      .card{max-width:420px;margin:4rem auto;border:1px solid #e5e7eb;border-radius:.75rem;box-shadow:0 1px 2px rgb(0 0 0 / .05);padding:1.5rem}
      .title{font-weight:800;font-size:1.5rem;margin:0;color:var(--text);text-align:center}
      .muted{color:var(--text);opacity:.7;font-size:.9rem;text-align:center;margin:.25rem 0 1rem}
      .label{font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:.25rem}
      .input{display:flex;align-items:center;gap:.5rem;border:1px solid #e5e7eb;border-radius:.5rem;padding:.5rem .75rem}
      .input input{border:0;outline:0;width:100%;font-size:.95rem;color:var(--text)}
      .btn{width:100%;background:var(--brand);color:var(--text);font-weight:800;border:1px solid rgba(0,0,0,.06);border-radius:.5rem;padding:.7rem .85rem;cursor:pointer;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
      .btn:hover{opacity:.95}
      .back{display:inline-block;margin-top:1rem;color:var(--text);text-decoration:none;font-weight:700}
      header{position:sticky;top:0;border-bottom:1px solid #e5e7eb;background:#fff}
      header .row{display:flex;align-items:center;justify-content:space-between;height:64px}
      header a{color:var(--text);text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <header>
      <div class="container row">
        <a href="/">Travel with Kabir</a>
        <nav><a href="/">Home</a></nav>
      </div>
    </header>
    <main class="container">
      <div class="card">
        <h1 class="title">Login</h1>
        <p class="muted">Access your bookings and manage your trips</p>
        <form>
          <div style="margin-bottom:.75rem">
            <div class="label">Email</div>
            <div class="input"><span>📧</span><input type="email" placeholder="you@example.com" /></div>
          </div>
          <div style="margin-bottom:1rem">
            <div class="label">Password</div>
            <div class="input"><span>🔒</span><input type="password" placeholder="••••••••" /></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin:.5rem 0 1rem;color:var(--text);opacity:.8;font-size:.9rem">
            <span>Already have an account?</span>
            <a href="/login.html" style="font-weight:700;color:var(--text);text-decoration:underline">Sign in</a>
          </div>
          <button type="button" class="btn">Sign in</button>
        </form>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <a href="/signup.html" class="back">Create an account</a>
          <a href="/" class="back">Back to home →</a>
        </div>
      </div>
    </main>
  </body>
</html>
